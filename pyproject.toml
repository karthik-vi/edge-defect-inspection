[project]
name = "edgeinspect"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "opencv-python-headless", "scikit-learn", "pyyaml", "pydantic-settings", "torch", "torchvision", "faiss-cpu"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
[tool.pytest.ini_options]
pythonpath = ["src"]
